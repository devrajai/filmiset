name: Refresh what is new

# Keeps the "Aaj naya" shelf honest: what is in Indian cinemas this week, what is coming, and what
# just landed on each platform. All of it from TMDB, which is the licensed source for release dates
# and streaming availability — nothing here is scraped from a streaming or download site.
#
# Weekly, Monday 02:30 UTC (08:00 IST). One run is about ninety seconds, so roughly six minutes a
# month against a 2,000-minute quota that the other repositories already use 1,500 of.

on:
  workflow_dispatch:
  # Daily, 08:00 IST. This is the one that has to run every day: a film released in cinemas today or
  # added to a platform last night should be on the site tomorrow morning, not next Monday. Ninety
  # seconds a run, so about forty-five minutes a month — the other three stay weekly because
  # episodes, cast and posters do not change at that speed, and together that is 189 of the 500
  # available minutes.
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch what is new
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          mkdir -p data
          python3 scripts/fetch_fresh.py --out data/fresh.json.gz --days 30 --region IN

      - name: What came out
        run: |
          ls -lh data/fresh.json.gz
          python3 -c "import gzip,json;d=json.loads(gzip.open('data/fresh.json.gz','rt',encoding='utf-8').read());print('cinema',len(d['cinema']),'| upcoming',len(d['upcoming']));[print(' ',k,len(v),'films') for k,v in list(d['ott'].items())[:6]];[print(' ',k,len(v),'series') for k,v in list(d['series'].items())[:6]]"

      # Deliberately NOT deploying to Cloudflare. A Pages deployment replaces the whole directory,
      # and this workflow only ever produces one file — so deploying data/ from here wiped the 14
      # catalogue buckets, the episodes, the actors, the cast and the posters, every week. That is
      # what broke search and the posters. The file is small and the site already falls back to the
      # copy in the repo, so it is committed and read from there.
      # and a copy in the repo, because it is small and the site falls back to it
      - name: Commit the file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fresh.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Refresh what is new: cinema, upcoming and platform arrivals"
            git pull --rebase origin main || true
            git push || echo "push skipped"
          fi
