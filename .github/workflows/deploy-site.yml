name: Deploy site

# Publishes the page itself to Cloudflare Pages, alongside the data it reads. Vercel deploys on push
# through its own GitHub integration, and when that stops — a disconnected project, a failed build, a
# full storage quota — the site silently keeps serving the previous version and there is no way to see
# why from here, because the Vercel token in this repository can read only the user profile. This
# workflow puts the same files on a host whose token does work, so a change can always be seen.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon*.png'
      - 'icon.svg'
      - 'og.png'
      - 'robots.txt'
      - 'sitemap.xml'
      - '_headers'
      - 'data/*.json'
      - 'data/*.json.gz'

permissions:
  contents: read

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        run: |
          set -e
          if [ -z "$CF_TOKEN" ]; then echo "::error::No Cloudflare token"; exit 1; fi
          ACCT=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
                 https://api.cloudflare.com/client/v4/accounts \
                 | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ACCT" ]; then echo "::error::Token sees no account"; exit 1; fi

          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"filmiset","production_branch":"main"}' > /dev/null || true

          rm -rf dist && mkdir -p dist
          for f in index.html privacy.html terms.html sw.js manifest.webmanifest \
                   icon.svg icon-192.png icon-512.png og.png robots.txt sitemap.xml _headers; do
            [ -f "$f" ] && cp "$f" dist/ || true
          done
          # Every data file the page loads at boot, not a curated subset. Excluding catalog.json
          # because it is IMDb-derived left the page with no titles at all — it is the file the grid
          # reads first, so every visit rendered "Kuch nahi mila".
          mkdir -p dist/data
          cp data/*.json data/*.json.gz dist/data/ 2>/dev/null || true
          echo "files: $(find dist -type f | wc -l), $(du -sh dist | cut -f1)"
          ls dist | head -20

          export CLOUDFLARE_ACCOUNT_ID="$ACCT"
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          npx --yes wrangler@3 pages deploy dist --project-name filmiset --branch main --commit-dirty=true
