name: Fetch posters

# Gives the top N titles a poster from TMDB. The site carries 832,677 titles and posters for about
# 24,000; fetching all of them is nine hours of API calls, fetching the ones people actually look at
# is under an hour. Re-runnable: it skips anything that already has one, so you can raise --limit
# over several runs instead of doing it all at once.
#
# Manual only — the Actions quota is 2,000 minutes a month and the other repositories use about 1,500.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many titles to fetch this run
        required: false
        default: '100000'
      workers:
        description: Parallel requests
        required: false
        default: '16'

permissions:
  contents: read

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the catalogue from Cloudflare
        run: |
          set -e
          mkdir -p data
          for b in ab cd ef gh ij kl mn num op qr st uv wx yz; do
            curl -sSfL "https://filmiset-data.pages.dev/ix_${b}.json.gz" -o "data/ix_${b}.json.gz"
          done
          curl -sSfL "https://filmiset-data.pages.dev/ix_manifest.json" -o data/ix_manifest.json
          echo "buckets: $(ls data/ix_*.json.gz | wc -l)"

      - name: Fetch posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 scripts/fetch_posters.py \
            --catalogue data --out data/posters \
            --limit "${{ github.event.inputs.limit || '100000' }}" \
            --workers "${{ github.event.inputs.workers || '16' }}"

      - name: How much came out
        run: |
          du -sh data/posters
          cat data/posters/_manifest.json

      - name: Deploy to Cloudflare Pages
        run: |
          set -e
          if [ -z "$CF_TOKEN" ]; then echo "::warning::No Cloudflare token"; exit 0; fi
          ACCT=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
                 https://api.cloudflare.com/client/v4/accounts \
                 | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ACCT" ]; then echo "::error::Token sees no account"; exit 1; fi
          export CLOUDFLARE_ACCOUNT_ID="$ACCT"
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          npx --yes wrangler@3 pages deploy data --project-name filmiset-data --branch main --commit-dirty=true

      - name: Commit the manifest only
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posters/_manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Update the poster manifest"
            git pull --rebase origin main || true
            git push
          fi
