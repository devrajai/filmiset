name: Rebuild catalogue

# Rebuilds the fourteen search buckets from IMDb's own files. This exists because the buckets had no
# producer in the repo — they had been built once and then hosted — so when a bad deployment deleted
# them from Cloudflare there was nothing to re-run. Now there is.
#
# About twenty minutes: two downloads of roughly 200 MB each and a join over 12 million rows.

on:
  workflow_dispatch:
    inputs:
      min_votes:
        description: Skip titles with fewer votes than this
        required: false
        default: '0'

  # Daily, 07:00 IST, first in the chain — the other workflows read the catalogue this
  # produces. IMDb's bulk files are updated every day and include Indian web series that
  # TMDB does not carry, so this is what puts a JioHotstar or ZEE5 show into search within
  # a day of it being listed. Twenty minutes a run, which costs nothing now that the
  # repository is public.
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the IMDb files
        run: |
          set -e
          mkdir -p data
          echo "downloading title.basics…"
          curl -sSfL --retry 3 --max-time 900 https://datasets.imdbws.com/title.basics.tsv.gz -o data/title.basics.tsv.gz
          echo "downloading title.ratings…"
          curl -sSfL --retry 3 --max-time 900 https://datasets.imdbws.com/title.ratings.tsv.gz -o data/title.ratings.tsv.gz
          ls -lh data/

      - name: Build the buckets
        run: |
          python3 scripts/build_catalogue.py --data data --out data --min-votes "${{ github.event.inputs.min_votes || '0' }}"

      - name: What came out
        run: |
          du -sh data/ix_*.json.gz | tail -3
          cat data/ix_manifest.json

      # Cloudflare Pages refuses any single file over 25 MiB, and data/ holds the two raw IMDb
      # archives at about 200 MB each. Copy only what belongs on the site into a clean directory —
      # the buckets and the manifest — and deploy that. The previous attempt uploaded the whole
      # folder and failed on the first large file, after the build itself had already succeeded.
      - name: Deploy to Cloudflare Pages
        run: |
          set -e
          if [ -z "$CF_TOKEN" ]; then echo "::warning::No Cloudflare token"; exit 0; fi
          ACCT=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
                 https://api.cloudflare.com/client/v4/accounts \
                 | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ACCT" ]; then echo "::error::Token sees no account"; exit 1; fi
          rm -rf dist && mkdir -p dist
          cp data/ix_*.json.gz dist/
          cp data/ix_manifest.json dist/ 2>/dev/null || true
          echo "uploading $(ls dist | wc -l) files, $(du -sh dist | cut -f1)"
          ls -lh dist | head -20
          export CLOUDFLARE_ACCOUNT_ID="$ACCT"
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          npx --yes wrangler@3 pages deploy dist --project-name filmiset-data --branch main --commit-dirty=true
