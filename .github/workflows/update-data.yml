name: Refresh catalog data

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow openpyxl ijson
      - name: Fetch free movie data (Wikidata, no API key)
        run: python3 scripts/fetch_data.py --out data/catalog.json
      - name: Collect from YouTube channels (RSS, no key)
        run: python3 scripts/fetch_youtube.py
      - name: Enrich with TMDB (OTT, runtime, rating, age cert, trailer)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_tmdb.py --region IN
      - name: TMDB discover (trending / popular / per-language)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_tmdb_discover.py --region IN --pages 2
      - name: Add IMDb ratings (free IMDb datasets)
        run: python3 scripts/fetch_imdb.py
      - name: IMDb full catalogue (11.6M titles, free datasets)
        run: python3 scripts/fetch_imdb_catalog.py --top 2500000
      - name: Posters for the IMDb rows (rolling, TMDB by IMDb id)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_posters_tmdb.py --limit 300000 --per-run 12000
      - name: Download + compress posters locally
        run: python3 scripts/download_posters.py --workers 2 --delay 0.35
      - name: Build Excel backup
        run: python3 scripts/make_backup.py --out data/filmiset-backup.xlsx
      - name: Commit if changed
        run: |
          git config user.name "filmiset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes today"
          else
            git commit -m "chore: refresh catalog + posters (Wikidata)"
            git push
          fi
