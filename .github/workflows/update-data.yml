name: Refresh catalog data

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow
      - name: Fetch free movie data (Wikidata, no API key)
        run: python3 scripts/fetch_data.py --out data/catalog.json
      - name: Collect from YouTube channels (RSS, no key)
        run: python3 scripts/fetch_youtube.py
      - name: Fill OTT availability (TMDB, optional — needs TMDB_API_KEY secret)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_ott.py --region IN
      - name: Download + compress posters locally
        run: python3 scripts/download_posters.py --workers 2 --delay 0.35
      - name: Commit if changed
        run: |
          git config user.name "filmiset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/movies.json data/youtube.json data/ott_cache.json posters
          if git diff --staged --quiet; then
            echo "no changes today"
          else
            git commit -m "chore: refresh catalog + posters (Wikidata)"
            git push
          fi
