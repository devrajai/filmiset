name: Refresh catalog data

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow openpyxl ijson
      - name: Fetch free movie data (Wikidata, no API key)
        run: python3 scripts/fetch_data.py --out data/catalog.json
      - name: Collect from YouTube channels (RSS, no key)
        run: python3 scripts/fetch_youtube.py
      - name: Enrich with TMDB (OTT, runtime, rating, age cert, trailer)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_tmdb.py --region IN
      - name: TMDB discover (trending / popular / per-language)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_tmdb_discover.py --region IN --pages 2 --indian-pages 5
      - name: Add IMDb ratings (free IMDb datasets)
        run: python3 scripts/fetch_imdb.py
      - name: TMDB full catalogue sweep (movies + TV, year by year)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_tmdb_full.py --start-year 1950 --end-year 2026 --max-pages 50
      - name: IMDb full catalogue (11.6M titles, free datasets)
        run: python3 scripts/fetch_imdb_catalog.py --top 2500000
      - name: IMDb Indian titles (region/language from the akas dump)
        run: python3 scripts/fetch_imdb_indian.py --top 20000
      - name: Trending now (TMDB, for the Trending chip)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_trending.py --region IN
      - name: TMDB daily ID exports (full catalogue, no key needed)
        run: python3 scripts/fetch_tmdb_exports.py --min-popularity 1
      - name: Watch providers — where each title streams in India (TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_watch_providers.py
      - name: TVmaze — seasons, episodes and network per series (no key needed)
        run: python3 scripts/fetch_tvmaze.py
      - name: Cast + director for every title (IMDb bulk files — no API, no rate limit)
        run: python3 scripts/fetch_imdb_cast.py --limit 300000
      - name: Metadata for the IMDb rows (cast, director, overview)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_tmdb_details.py --limit 300000 --per-run 20000 --workers 12
      - name: Posters for the IMDb rows (rolling, TMDB by IMDb id)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_posters_tmdb.py --limit 600000 --per-run 50000 --workers 12
      - name: Download + compress posters locally
        run: python3 scripts/download_posters.py --workers 2 --delay 0.35
      - name: Build Excel backup
        run: python3 scripts/make_backup.py --out data/filmiset-backup.xlsx
      - name: Commit if changed
        run: |
          git config user.name "filmiset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes today"
          else
            git commit -m "chore: refresh catalog + posters (Wikidata)"
            git push
          fi
