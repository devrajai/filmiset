name: Refresh catalog data

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch free movie data (Wikidata, no API key)
        run: python3 scripts/fetch_data.py --out data/catalog.json
      - name: Commit if changed
        run: |
          git config user.name "filmiset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --staged --quiet; then
            echo "no changes today"
          else
            git commit -m "chore: refresh catalog data (Wikidata)"
            git push
          fi
