name: Refresh catalog data

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow openpyxl ijson
      # ---- everything below writes to its own file, so it can all run at once ----
      # Before this, these eight fetchers ran one after another; now they share one machine
      # and finish in the time of the slowest single one.
      - name: Collect (8 fetchers in parallel)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YT_API_KEY }}
        run: |
          set -u
          run() { echo "::group::$1"; shift; "$@"; code=$?; echo "::endgroup::"; return $code; }
          pids=""
          run "Wikidata"        python3 scripts/fetch_data.py &
          pids="$pids $!"
          run "IMDb catalogue"  python3 scripts/fetch_imdb_catalog.py &
          pids="$pids $!"
          run "IMDb Indian"     python3 scripts/fetch_imdb_indian.py &
          pids="$pids $!"
          run "TMDB exports"    python3 scripts/fetch_tmdb_exports.py &
          pids="$pids $!"
          run "TVmaze"          python3 scripts/fetch_tvmaze.py &
          pids="$pids $!"
          run "Trending"        python3 scripts/fetch_trending.py --region IN &
          pids="$pids $!"
          run "YouTube free"    python3 scripts/fetch_youtube_free.py --min-minutes 20 --per-channel 12 &
          pids="$pids $!"
          run "Watch providers" python3 scripts/fetch_watch_providers.py &
          pids="$pids $!"
          run "YouTube RSS"     python3 scripts/fetch_youtube.py &
          pids="$pids $!"
          fail=0
          for p in $pids; do wait "$p" || fail=1; done
          exit $fail

      # ---- these all talk to TMDB and share a rate limit, so they run in a second wave ----
      - name: Enrich (TMDB + IMDb bulk, in parallel)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: |
          set -u
          run() { echo "::group::$1"; shift; "$@"; code=$?; echo "::endgroup::"; return $code; }
          pids=""
          run "TMDB enrich"   python3 scripts/fetch_tmdb.py &
          pids="$pids $!"
          run "TMDB discover" python3 scripts/fetch_tmdb_discover.py --indian-pages 5 &
          pids="$pids $!"
          run "TMDB full"     python3 scripts/fetch_tmdb_full.py &
          pids="$pids $!"
          run "IMDb cast"     python3 scripts/fetch_imdb_cast.py --limit 300000 &
          pids="$pids $!"
          run "IMDb ratings"  python3 scripts/fetch_imdb.py &
          pids="$pids $!"
          fail=0
          for p in $pids; do wait "$p" || fail=1; done
          exit $fail

      - name: Posters for the IMDb rows (rolling, TMDB by IMDb id)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDBKEY }}
        run: python3 scripts/fetch_posters_tmdb.py --limit 900000 --per-run 120000 --workers 16
      - name: Download + compress posters locally
        run: python3 scripts/download_posters.py --workers 2 --delay 0.35
      - name: Build Excel backup
        run: python3 scripts/make_backup.py --out data/filmiset-backup.xlsx
      - name: Commit if changed
        run: |
          git config user.name "filmiset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes today"
          else
            git commit -m "chore: refresh catalog + posters (Wikidata)"
            git push
          fi
