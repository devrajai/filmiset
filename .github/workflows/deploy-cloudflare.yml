name: Upload the catalogue to Cloudflare Pages

# Pushes data/ to a Cloudflare Pages project so the catalogue is served from Cloudflare's edge.
# Vercel's free tier counts every deployment against 10 GB of storage and it is already 75% full;
# Cloudflare has no such limit.
#
# The token is the CLOUDFLARE secret. The account id is not stored separately - it is looked up
# from the API with that token, which saves a second secret and one more place to get wrong.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Cloudflare Pages project name
        required: false
        default: filmiset-data

permissions:
  contents: read

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the token and find the account
        id: cf
        run: |
          set -e
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::No Cloudflare token. Add a repository secret named CLOUDFLARE."
            exit 1
          fi
          echo "token length: ${#CF_TOKEN}"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts -o /tmp/accounts.json
          head -c 400 /tmp/accounts.json
          ACCT=$(python3 -c "import json;d=json.load(open('/tmp/accounts.json'));r=d.get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ACCT" ]; then
            echo "::error::Token works but sees no account. Give it Cloudflare Pages Edit permission."
            cat /tmp/accounts.json
            exit 1
          fi
          echo "account id: $ACCT"
          echo "account_id=$ACCT" >> "$GITHUB_OUTPUT"

      - name: What are we uploading
        run: |
          echo "files: $(find data -type f | wc -l)"
          du -sh data

      - name: Create the project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -e
          PROJECT="${{ github.event.inputs.project || 'filmiset-data' }}"
          CODE=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}")
          echo "create project -> HTTP $CODE (200 new, 409 already exists, both fine)"
          head -c 300 /tmp/create.json

      - name: Upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -e
          PROJECT="${{ github.event.inputs.project || 'filmiset-data' }}"
          npx --yes wrangler@3 pages deploy data --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Where it landed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          PROJECT="${{ github.event.inputs.project || 'filmiset-data' }}"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" -o /tmp/proj.json
          python3 -c "import json;d=json.load(open('/tmp/proj.json'));r=d.get('result') or {};print('project:',r.get('name'));print('url:',r.get('subdomain'));print('domains:',r.get('domains'))"
